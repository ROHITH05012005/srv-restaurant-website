<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Saffron Arcs (Top and Bottom) -->
  <path d="M 250 40 A 210 210 0 0 1 460 250" fill="none" stroke="#FF6B00" stroke-width="28" stroke-linecap="round" />
  <path d="M 40 250 A 210 210 0 0 0 250 460" fill="none" stroke="#FF6B00" stroke-width="28" stroke-linecap="round" />
  
  <!-- Green Arc (Bottom Right) -->
  <path d="M 460 250 A 210 210 0 0 1 250 460" fill="none" stroke="#138808" stroke-width="28" stroke-linecap="round" />
  
  <!-- Green Arc (Top Left) -->
  <path d="M 40 250 A 210 210 0 0 1 250 40" fill="none" stroke="#138808" stroke-width="28" stroke-linecap="round" />

  <!-- Chess Piece Silhouette (White) -->
  <path d="M 210 380 L 290 380 L 280 220 L 300 210 L 300 180 L 280 180 L 280 160 L 220 160 L 220 180 L 200 180 L 200 210 L 220 220 Z" fill="#FFFFFF" />
  
  <!-- SRV Text (Gold Gradient Effect) -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F0D060;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A88920;stop-opacity:1" />
    </linearGradient>
  </defs>
  <text x="250" y="295" font-family="Arial Black, sans-serif" font-size="120" font-weight="900" fill="url(#goldGradient)" text-anchor="middle" letter-spacing="-5">SRV</text>
</svg>
